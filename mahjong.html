<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麻雀計算</title>
    <link rel="stylesheet" href="mjStyle.css">
</head>

<body>
    <script src="mjTiles.js"></script>
    <script src="mjScript.js"></script>
    <h1 class="center">麻雀計算</h1>

    <!-- Mahjong version selector -->
    <div class="version-selector">
        <label>
            <input type="checkbox" checked disabled> 日麻
        </label>
        <!-- can add more later -->
    </div>

    <!-- Tile selection grid: 5 rows x 4 columns = up to 20 tiles, but we'll validate 14-18-->
    <div class="tile-grid">
        <h3>手牌 (最少14張，最多18張)</h3>
        <table id="tileTable">
            <tbody id="tileGridBody"></tbody>
        </table>
        <div class="grid-controls">
            <button id="resetGridBtn">清空所有</button>
            <span id="tileCountDisplay">已選: 0 張</span>
        </div>
        <button id="confirmHandBtn">確定牌型</button>
    </div>


    <!-- Tiles display and adjustment -->
    <div id="tilesContainer">
        <!-- This will be populated after recognition or manual input -->
    </div>

    <!-- Game state checkboxes and dropdowns -->
    <div class="game-state">
        <label><input type="checkbox" id="tsumo"> 自摸</label>
        <label><input type="checkbox" id="dealer"> 莊家</label>
        <label><input type="checkbox" id="riichi"> 立直</label>
        <label><input type="checkbox" id="ippatsu"> 一發</label>
    </div>

    <div class="wind-selectors">
        <label>圈風:
            <select id="roundWind">
                <option value="東">東</option>
                <option value="南">南</option>
                <option value="西">西</option>
                <option value="北">北</option>
            </select>
        </label>
        <label>門風:
            <select id="playerWind">
                <option value="東">東</option>
                <option value="南">南</option>
                <option value="西">西</option>
                <option value="北">北</option>
            </select>
        </label>
    </div>

    <div class="dora-selectors">
        <label>紅寶牌:
            <input type="number" id="akaDora" min="0" max="3" value="0">
        </label>
        <div class="dora-indicators-list">
            <label>寶牌指示牌:</label>
            <div id="doraIndicatorsContainer"></div>
            <button id="addDoraBtn">+ 新增寶牌指示牌</button>
        </div>
        <div class="dora-indicators-list">
            <label>裏寶牌指示牌 (立直時):</label>
            <div id="uraDoraIndicatorsContainer"></div>
            <button id="addUraDoraBtn">+ 新增裏寶牌指示牌</button>
        </div>
        <label>花牌:
            <input type="number" id="flowers" min="0" max="4" value="0">
        </label>
    </div>

    <!-- Calculate button -->
    <div class="center">
        <button id="calculateBtn">計算</button>
    </div>

    <!-- Result display -->
    <div id="result"></div>

</body>

</html>
